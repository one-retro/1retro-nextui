name: pak

# Assemble the pak zip when a release is published. The release itself is cut
# from the 1Retro source tree (`just publish-nextui-release`), which attaches
# the two binaries; everything else in the pak lives here, so this is where the
# zip is put together and attached to the same release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pak:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Through the environment, never interpolated into the script: a tag name
      # is attacker-chosen text as far as the shell is concerned.
      - name: Resolve the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          [ -n "$tag" ] || tag=$(gh release view --json tagName --jq .tagName)
          echo "TAG=$tag" >>"$GITHUB_ENV"

      - name: Fetch the binaries from the release
        run: |
          mkdir -p build
          gh release download "$TAG" --dir build \
            --pattern '1retro-nextui-arm64' \
            --pattern '1retro-nextui-arm'

      - name: Assemble the pak
        run: |
          set -euo pipefail
          PAK="build/1Retro Sync.pak"
          LOCK=pak/minui.lock
          mkdir -p "$PAK/bin/arm64" "$PAK/bin/arm"

          cp pak/launch.sh "$PAK/"
          cp pak/bin/on-boot "$PAK/bin/"
          # The store reads pak.json from the repo root; the pak needs its own
          # copy, and they are the same file.
          cp pak.json "$PAK/"
          cp build/1retro-nextui-arm64 "$PAK/bin/arm64/1retro-nextui"
          cp build/1retro-nextui-arm "$PAK/bin/arm/1retro-nextui"

          presenter_version=$(awk '$1 == "presenter_version" { print $2 }' "$LOCK")
          list_version=$(awk '$1 == "list_version" { print $2 }' "$LOCK")

          # Every bundled helper is fetched at its pinned version and checked
          # against the lock. A tag can be moved and an asset re-uploaded, so
          # without this the bytes reaching a handheld are whatever that URL
          # returns today rather than what was reviewed. The pins are written by
          # ./scripts/pin-minui.sh, which also owns the platform/flavour table.
          #
          # Read from a file rather than piped into the loop: a `while read` on
          # the far side of a pipe runs in a subshell, where a failing `exit 1`
          # would end the subshell and let the build carry on regardless.
          awk '$1 == "sha256" { print $2, $3, $4, $5 }' "$LOCK" >build/pins
          test -s build/pins || { echo "no pins in $LOCK" >&2; exit 1; }
          while read -r tool platform flavour sha; do
              case "$tool" in
                  minui-presenter) version="$presenter_version" ;;
                  minui-list) version="$list_version" ;;
                  *) echo "unknown tool in $LOCK: $tool" >&2; exit 1 ;;
              esac
              mkdir -p "$PAK/bin/$platform"
              dest="$PAK/bin/$platform/$tool"
              curl -fsSL -o "$dest" \
                "https://github.com/josegonzalez/$tool/releases/download/$version/$tool-$flavour"
              if ! echo "$sha  $dest" | sha256sum -c - >/dev/null 2>&1; then
                  echo "$tool-$flavour does not match the SHA-256 in $LOCK; refusing it" >&2
                  echo "  expected $sha" >&2
                  echo "  got      $(sha256sum "$dest" | cut -d' ' -f1)" >&2
                  exit 1
              fi
              chmod +x "$dest"
              echo "verified $tool-$flavour -> bin/$platform/$tool"
          done <build/pins

          curl -fsSL -o "$PAK/bin/LICENSE.minui-presenter" \
            "https://raw.githubusercontent.com/josegonzalez/minui-presenter/$presenter_version/LICENSE"
          curl -fsSL -o "$PAK/bin/LICENSE.minui-list" \
            "https://raw.githubusercontent.com/josegonzalez/minui-list/$list_version/LICENSE"

          chmod +x "$PAK/launch.sh" "$PAK/bin/on-boot" "$PAK"/bin/arm*/1retro-nextui

          # Contents at the zip root, per the store's packaging rule.
          (cd "$PAK" && zip -qr - .) > build/1Retro.Sync.pak.zip
          unzip -l build/1Retro.Sync.pak.zip | tail -5

      - name: Attach it to the release
        run: gh release upload "$TAG" build/1Retro.Sync.pak.zip --clobber
